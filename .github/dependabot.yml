version: 2
updates:
  - package-ecosystem: maven
    directory: '/'
    schedule:
      interval: weekly
    groups:
      java:
        patterns:
          - "*"
    ignore:
      # Maven 3.10 stages _remote.repositories and maven-metadata-local.xml into the
      # Central bundle, which Central rejects. Revisit once central-publishing-maven-plugin
      # (0.11.0) supports it.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      pipeline:
        patterns:
          - "*"
